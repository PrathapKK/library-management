// src/main/resources/security-config.properties
# CORS Configuration
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type

# URL Patterns and Roles
security.permit-all=/api/auth/**,/api/users/register,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/error
security.role.user=/api/books/**
security.role.librarian=/api/books/**,/api/transactions/**
security.role.admin=/api/books/**,/api/users/**,/api/transactions/**